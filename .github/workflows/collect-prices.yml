name: Collect prices

# Mon-Fri 09:30 UTC = 16:30 ICT, after the 15:00 close and the ATC session.
# Manual run with `start` does a historical backfill, e.g. start=2020-01-01.
on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start date (YYYY-MM-DD). Empty = last 14 days."
        required: false
        default: ""
      tickers:
        description: "Comma-separated tickers override (empty = all in config/tickers.json)."
        required: false
        default: ""
      dry_run:
        description: "Fetch and validate only, do not write files."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect prices
        env:
          START: ${{ inputs.start }}
          TICKERS: ${{ inputs.tickers }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [ -n "$START" ] && args+=(--start "$START")
          [ -n "$TICKERS" ] && args+=(--tickers "$TICKERS")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python scripts/collect_prices.py "${args[@]}"

      - name: Commit data
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "data(prices): $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
