name: Collect news

# RSS feeds only keep ~2-3 days of items, so run every 3 hours (8x/day) to never lose articles.
# GitHub cron is UTC and can be delayed by minutes; correctness does not depend on exact timing
# because every record keeps the source's own published_at.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared group: news / prices / health commits are serialized, never cancelled.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect news
        run: python scripts/collect_news.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "data(news): $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
