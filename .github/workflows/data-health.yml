name: Data health

# Mondays 02:00 UTC (09:00 ICT). The job FAILS when a problem is found, so GitHub emails the repo owner.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build report
        id: report
        continue-on-error: true
        run: python scripts/data_health.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "data(health): $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail if problems were found
        if: steps.report.outcome == 'failure'
        run: |
          echo "::error::Data health check found problems. See data/health/latest.md"
          exit 1
